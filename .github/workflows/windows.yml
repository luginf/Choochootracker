name: Windows

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2025
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            base-devel
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-SDL2
            zip
      - name: Build Windows package
        run: |
          export PATH=/ucrt64/bin:/usr/bin:$PATH
          make -C tracker -j4 windows
          mkdir -p releases
          archive_ref=${GITHUB_REF_NAME:-manual}
          archive_ref=${archive_ref//\//-}
          cd tracker/build/windows
          zip -qr "../../../releases/ChooChooTracker-${archive_ref}-Windows.zip" .
      - uses: actions/upload-artifact@v4
        with:
          name: choochootracker-windows
          path: releases/*.zip
          if-no-files-found: error
